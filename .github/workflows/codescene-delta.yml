# CodeScene CLI delta on pull requests — JSON artifact + job summary + blocking gate.
# Complements the CodeScene GitHub App (suppress links, quality-gate profile in codescene.io).
# Docs: https://codescene.io/docs/cli/index.html
# Secret: CS_ACCESS_TOKEN (same PAT as .github/workflows/refactoring-agent.yml)
name: CodeScene delta

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: codescene-delta-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  delta:
    name: CodeScene delta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install CodeScene CLI
        run: bash scripts/ci-install-codescene-cli.sh

      - name: Delta analysis
        env:
          CS_ACCESS_TOKEN: ${{ secrets.CS_ACCESS_TOKEN }}
        run: |
          set +e
          cs delta "origin/${{ github.base_ref }}" HEAD \
            --output-format json --pretty --error-on-warnings > codescene-delta.json
          ec=$?
          set -e
          bash scripts/ci-codescene-delta-summary.sh codescene-delta.json
          exit "${ec}"

      - uses: actions/upload-artifact@v7
        if: always() && hashFiles('codescene-delta.json') != ''
        with:
          name: codescene-delta-pr-${{ github.event.pull_request.number }}
          path: codescene-delta.json
          retention-days: 14
