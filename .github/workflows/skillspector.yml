# SkillSpector — security scan of `.agents/skills/`. Advisory; findings → SARIF.
# Spec: specs/skillspector.md
name: SkillSpector

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  skillspector:
    name: SkillSpector (.agents/skills/)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Pin to an upstream release tag and immutable commit SHA. Bump together
      # with .skillspector-baseline.yaml and specs/skillspector.md.
      - name: Install SkillSpector
        env:
          SKILLSPECTOR_VERSION: 2.8.1
          SKILLSPECTOR_COMMIT: 0a1546b03827b08035eb011d525770c7bb29d6c2
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "git+https://github.com/nvidia/skillspector@${SKILLSPECTOR_COMMIT}"
          skillspector --version

      - name: Scan .agents/skills/
        run: |
          set +e
          skillspector scan .agents/skills/ \
            --no-llm \
            --baseline .skillspector-baseline.yaml \
            --format sarif \
            --output skillspector-raw.sarif
          ec=$?
          set -e
          if [ ! -f skillspector-raw.sarif ]; then
            echo "::error::SkillSpector did not produce skillspector-raw.sarif (exit ${ec})"
            exit 1
          fi
          if [ "${ec}" -gt 1 ]; then
            exit "${ec}"
          fi
          # exit 1 = findings only; filter and upload SARIF, do not fail the workflow

      - name: Strip baseline-suppressed findings from SARIF
        id: strip-skillspector
        run: |
          set -e
          python scripts/strip-skillspector-suppressions.py skillspector-raw.sarif skillspector.sarif

      - name: Upload SARIF to GitHub Code Scanning
        if: always() && steps.strip-skillspector.outcome == 'success' && hashFiles('skillspector.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: skillspector.sarif
          category: skillspector
